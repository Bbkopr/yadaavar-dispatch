# re-register schedule 2026-11-08
name: yadaavar-dispatch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @tgcloud/cli@0.2
      - name: Dispatch due reminders
        run: tgcloud run endpoints/dispatch '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
